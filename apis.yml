aid: a10-networks
name: A10 Networks
description: >-
  A10 Networks (NYSE: ATEN) is a San Jose, California–headquartered application delivery and cybersecurity company
  founded in 2004 by Lee Chen. A10 builds the ACOS (Application Centric Operating System) software platform that powers
  its Thunder family of physical appliances, virtual machines (vThunder), and containerized form factors across
  hyperscalers and private clouds. The product line spans the Thunder ADC (Application Delivery Controller for L4–L7
  server load balancing and GSLB), the Thunder TPS / A10 Defend portfolio (DDoS detection, mitigation, orchestration,
  and Threat Control SaaS) protecting service-provider and enterprise networks from volumetric and application-layer
  attacks, Thunder CGN (Carrier-Grade NAT and IPv4/IPv6 transition), Thunder CFW (consolidated firewall, VPN, CGN, and
  secure web gateway), SSL Insight for encrypted traffic decryption, the A10 Defend Next-Gen WAF (incorporating
  ThreatX), and the A10 AI Firewall for protecting LLM and AI application traffic. Every ACOS device exposes the aXAPI
  v3 — a RESTful HTTPS interface that is the primary configuration and operational control plane for the platform,
  supporting ACOS 4.0.0 through 7.0.2. The aXAPI surface is exhaustive (the official Terraform provider exposes 3,627
  resources) and is wrapped by official Ansible collections (a10-acos-axapi, a10-acos-cli), a Python client
  (acos-client), the Thunder Kubernetes Connector (TKC, with 24 CRDs for pod-driven VIP automation), and integrations
  for OpenStack Octavia, Neutron LBaaS, AWS CloudFormation, Azure ARM, VMware vSphere, Helm, and Prometheus. A10
  reported record annual revenue of $290.6M in FY2025 (up 11.0% year over year) under CEO Dhrupad Trivedi, serving
  7,700+ customers across 117 countries.
