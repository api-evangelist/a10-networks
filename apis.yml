apis:
- aid: a10-networks:thunder-kubernetes-connector
  name: A10 Thunder Kubernetes Connector (TKC)
  tags:
  - Kubernetes
  - CRD
  - Cloud Native
  - Application Delivery
  - Service Mesh
  humanURL: https://github.com/a10networks/tkc-doc
  description: >-
    The Thunder Kubernetes Connector (TKC) runs inside Kubernetes and configures upstream Thunder ADC
    objects automatically as pods are created and scaled. It defines 24 CRDs covering VirtualServer, VirtualPort,
    ServiceGroup, HealthMonitor, NatPool, A10IPPool, ActiveActiveHADevice, ClientSsl/ServerSsl templates,
    TCP/UDP/HTTP/ HTTPS templates, persistence templates, policy templates, and cipher templates — exposing
    the full L4–L7 ADC surface as native Kubernetes resources.
  properties:
  - url: https://github.com/a10networks/tkc-doc
    type: Documentation
  - url: https://github.com/a10networks/tkc-doc
    type: SourceCode
  - url: crd/
    type: KubernetesCRD
    x-description: 24 CRDs covering the SLB and template object model.
